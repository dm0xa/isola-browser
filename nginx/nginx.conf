user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 ipv6=off valid=10s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Do not advertise the exact nginx version in the Server header / error pages.
    server_tokens off;

    # The API takes small JSON bodies; nothing legitimate is large. This caps
    # what an unauthenticated client can make the backend buffer. WebSocket
    # upgrades are not affected (no request body is read for them).
    client_max_body_size 1m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;


    # Proxy settings
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    server {
        listen 80;
        server_name isola.local localhost;

        # This listener serves plain HTTP. Browsers ignore HSTS sent over HTTP,
        # so terminate TLS here instead of shipping cleartext: mount certs and
        # enable the 443 server below, then HSTS is emitted over HTTPS.
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

        # Liveness for the container HEALTHCHECK — answered by nginx itself so
        # it does not depend on an upstream being reachable.
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok";
        }

        # Frontend SPA
        location / {
            set $frontend_upstream frontend:5173;
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # API
        location /api/ {
            set $backend_upstream backend:8080;
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket relay (video + input)
        location /ws/ {
            set $backend_upstream backend:8080;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # ── HTTPS (recommended) ─────────────────────────────────────────────
    # Mount certificates and uncomment to serve TLS + HSTS instead of
    # cleartext. Redirect the port-80 block above to https://$host$request_uri.
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name isola.local localhost;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     # ... repeat the location blocks above, adding:
    #     # proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
