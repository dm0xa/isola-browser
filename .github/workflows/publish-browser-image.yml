# Publishes the per-session sandbox image, so an install with no source
# checkout can fetch it instead of building it:
#
#   ghcr.io/dm0xa/isola-browser:electron   (plus :<tag> and :sha-<sha>)
#
# scripts/install.sh looks for that `:electron` tag and falls back to a local
# build when the pull fails (private package, no network). Triggered by pushing
# a tag like v1.0.0, or on demand from the Actions tab.
name: publish-browser-image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # arm64 is built under emulation, so the Electron npm ci inside the
      # node-builder stage runs for a foreign arch. That is the one part of this
      # image that is not arch-independent.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./browsers
          file: ./browsers/browser-node-electron/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dm0xa/isola-browser:electron
            ghcr.io/dm0xa/isola-browser:${{ github.ref_name }}
            ghcr.io/dm0xa/isola-browser:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
