name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          # Two Go modules live in this repo. Without both paths the module
          # cache is not restored and every run re-downloads from scratch.
          cache-dependency-path: |
            backend/go.sum
            browsers/isola-streamer/go.sum

      - name: Backend tests
        working-directory: backend
        run: go test ./...

      # The streamer's WebSocket suites encode through ffmpeg and fail rather
      # than skip when it is absent ("expected stream_init, got stream_reset"),
      # so ffmpeg must be on PATH before `go test`.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Streamer tests
        working-directory: browsers/isola-streamer
        run: go test -race ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm test

  # Nothing else in CI builds this image: `test` runs the suites, `release`
  # builds the binary tarballs and publish-browser-image builds the sandbox.
  # Without this job a broken backend/Dockerfile is only discovered by a user
  # running `docker compose up --build`.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # backend/Dockerfile copies .git and stamps the version with
          # `git describe`; a shallow clone would stamp a bare commit SHA.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Build the isola image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          tags: isola:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot it: the control plane serves /health with no Docker socket, so no
      # mount is needed. Assert only that a version is *reported* — on main
      # `git describe` yields `1.0.0-N-gSHORTSHA`, so an exact tag is wrong here.
      - name: Smoke the built image
        run: |
          docker run -d --name isola-ci -p 127.0.0.1:18080:8080 isola:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/health
          echo
          curl -fsS http://127.0.0.1:18080/api/config | grep -q '"version":"' || {
            echo "::error::/api/config reported no version"; exit 1; }
          echo "--- /api/config ---"
          curl -fsS http://127.0.0.1:18080/api/config

      - name: Container logs
        if: always()
        run: docker logs isola-ci || true

      - name: Stop the container
        if: always()
        run: docker rm -f isola-ci || true
