name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run per ref. A PR that gets another commit cancels its superseded run;
# stacked pushes to main coalesce (GitHub keeps one running + one pending per
# group, so the newest pending run replaces the older one) without ever killing
# a run that is already in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the expensive jobs are relevant to this change. `test`
  # always runs; `docker` runs when anything in the control-plane image moves,
  # and `fps` when the sandbox image or streamer does — together they are the
  # two multi-minute jobs. Nothing here is a required check (main carries no
  # branch protection), so skipping a job blocks no merge.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docker: ${{ steps.scope.outputs.docker }}
      browsers: ${{ steps.scope.outputs.browsers }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Unknown base (new branch, first push, unparsable event) means we
          # cannot prove what changed, so assume everything did rather than
          # skip coverage.
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            changed="$(git ls-files)"
          else
            changed="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          fi
          matches() { printf '%s\n' "$changed" | grep -Eq "$1"; }

          # backend/Dockerfile builds the frontend and embeds it, so every
          # input of that image belongs to this bucket.
          if matches '^(backend/|frontend/|browsers/|deploy/|nginx/|docker-compose|\.dockerignore|\.github/workflows/ci\.yml)'; then
            echo 'docker=true' >> "$GITHUB_OUTPUT"
          else
            echo 'docker=false' >> "$GITHUB_OUTPUT"
          fi

          # The fps job builds browsers/browser-node-electron and drives the
          # streamer against it.
          if matches '^(browsers/|\.github/workflows/ci\.yml)'; then
            echo 'browsers=true' >> "$GITHUB_OUTPUT"
          else
            echo 'browsers=false' >> "$GITHUB_OUTPUT"
          fi

          echo "--- changed files ---"
          printf '%s\n' "$changed"
          echo "--- docker/browsers ---"
          cat "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          # Two Go modules live in this repo. Without both paths the module
          # cache is not restored and every run re-downloads from scratch.
          cache-dependency-path: |
            backend/go.sum
            browsers/isola-streamer/go.sum

      - name: Backend tests
        working-directory: backend
        run: go test ./...

      # The streamer's WebSocket suites encode through ffmpeg and fail rather
      # than skip when it is absent ("expected stream_init, got stream_reset"),
      # so ffmpeg must be on PATH before `go test`.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Streamer tests
        working-directory: browsers/isola-streamer
        run: go test -race ./...

      # Named separately so a regression in the viewer → CDP key path is
      # visible in the job list instead of buried in the suite: punctuation
      # used to be dropped before Chromium saw it.
      - name: Streamer input regression
        working-directory: browsers/isola-streamer
        run: >-
          go test -race -count=1 -v
          -run 'TestEveryPrintableASCIIResolves|TestPunctuationUsesPhysicalKey|TestNonASCIISymbolIsTyped|TestSplitChordKeepsLiteralPlus|TestInputDispatch'
          .

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm test

  # Nothing else in CI builds this image: `test` runs the suites, `release`
  # builds the binary tarballs and publish-browser-image builds the sandbox.
  # Without this job a broken backend/Dockerfile is only discovered by a user
  # running `docker compose up --build`.
  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # backend/Dockerfile copies .git and stamps the version with
          # `git describe`; a shallow clone would stamp a bare commit SHA.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - name: Build the isola image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          tags: isola:ci
          load: true
          cache-from: type=gha
          # Pull requests write their own scope instead of the shared one, so
          # commit-by-commit churn cannot evict the layers a release build (and
          # this job on main) needs.
          cache-to: type=gha,mode=max${{ github.ref != 'refs/heads/main' && ',scope=isola-backend-pr' || '' }}

      # Boot it: the control plane serves /health with no Docker socket, so no
      # mount is needed. Assert only that a version is *reported* — on main
      # `git describe` yields `1.0.0-N-gSHORTSHA`, so an exact tag is wrong here.
      - name: Smoke the built image
        run: |
          docker run -d --name isola-ci -p 127.0.0.1:18080:8080 isola:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/health
          echo
          curl -fsS http://127.0.0.1:18080/api/config | grep -q '"version":"' || {
            echo "::error::/api/config reported no version"; exit 1; }
          echo "--- /api/config ---"
          curl -fsS http://127.0.0.1:18080/api/config

      - name: Container logs
        if: always()
        run: docker logs isola-ci || true

      - name: Stop the container
        if: always()
        run: docker rm -f isola-ci || true

  # The viewer-visible frame rate, end to end: build the sandbox image, boot it
  # against a real site and assert the compositor follows the capture rate as a
  # viewer attaches, reconnects, forces a capture re-send, resizes, and leaves.
  # A session that silently latches at the background rate (~1 fps) while every
  # metric still says "active" is invisible to the unit suites — this job is the
  # only place the two rates are measured together. The same image then types
  # real strings into a page, covering the viewer → CDP → Chromium path that
  # unit tests can only follow up to the command boundary.
  fps:
    needs: changes
    if: needs.changes.outputs.browsers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: browsers/isola-streamer/go.sum

      - uses: docker/setup-buildx-action@v4

      # Same cache scope as publish-browser-image.yml, so a release reuses the
      # layers this job just built instead of starting cold.
      - name: Build the sandbox image
        uses: docker/build-push-action@v7
        with:
          context: ./browsers
          file: ./browsers/browser-node-electron/Dockerfile
          tags: isola-browser:electron
          load: true
          cache-from: type=gha,scope=isola-browser-image
          # Same reason as the `docker` job: PR churn writes its own scope so it
          # cannot evict the shared browser-image cache the tag build imports.
          cache-to: type=gha,mode=max,scope=isola-browser-image${{ github.ref != 'refs/heads/main' && '-pr' || '' }}

      # 960x540: the assertion is the rate ratio, and the smaller surface keeps
      # raster+encode off the CI runner's two cores.
      - name: Viewer frame rate on a real site
        working-directory: browsers/isola-streamer
        env:
          ISOLA_FPS_E2E: '1'
          ISOLA_FPS_E2E_RESOLUTION: 960x540
        run: go test -run TestViewerFrameRateOnRealSite -v -count=1 -timeout 10m .

      # Same image, same real Electron/Chromium: the unit suite proves the CDP
      # commands, this proves Chromium actually types the characters into a form.
      - name: Typing symbols in a real sandbox
        working-directory: browsers/isola-streamer
        env:
          ISOLA_INPUT_E2E: '1'
          ISOLA_INPUT_E2E_RESOLUTION: 960x540
        run: go test -run TestSandboxTypingOnRealSite -v -count=1 -timeout 10m .

      - name: Container inventory
        if: failure()
        run: docker ps -a
