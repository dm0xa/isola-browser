# Dependency updates.
#
# Both npm trees and both Go modules are watched so advisories arrive as PRs
# instead of surfacing at the next manual audit: the Electron runner used to
# resolve whatever npm saw at build time, and the streamer sat on a 2020
# transitive for years.
version: 2
updates:
  # ── Go modules (two separate modules, so two directories) ──
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-backend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: gomod
    directory: /browsers/isola-streamer
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-streamer:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── npm ──
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # A Tailwind major is a migration, not a bump: the config format, the
    # PostCSS/Vite wiring, renamed utilities and the browser floor all change,
    # so it needs one deliberate PR with a visual diff instead of an
    # automatically generated one. Minor/patch still flow.
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/vite"
        update-types: ["version-update:semver-major"]
    groups:
      npm-frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The runner's lockfile is committed, so these PRs are exact upgrades.
  - package-ecosystem: npm
    directory: /browsers/electron-runner
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-electron-runner:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── GitHub Actions ──
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  # ── Base images ──
  # Only patch releases flow on their own (1.26.9 → 1.26.10, 3.20.2 → 3.20.3).
  # A new minor line is a migration, not a bump — and semver counts it as
  # "minor": the major of 1.26.10 is 1, so golang 1.26 → 1.27 and alpine
  # 3.20 → 3.24 are semver-minor. Ignoring only semver-major let those through.
  # Security patches still flow.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "golang"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "alpine"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: docker
    directory: /browsers/browser-node-electron
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "golang"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "debian"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
